spring.datasource.url=jdbc:h2:mem:prismite;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OAuth placeholders
# Fill these values in environment variables or .env when using real providers.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

discord.client-id=${DISCORD_CLIENT_ID:}
discord.client-secret=${DISCORD_CLIENT_SECRET:}
discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/discord/callback}
discord.bot-token=${DISCORD_BOT_TOKEN:}
discord.guild-id=${DISCORD_GUILD_ID:}

microsoft.client-id=${MICROSOFT_CLIENT_ID:}
microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/auth/microsoft/callback}
microsoft.tenant-id=${MICROSOFT_TENANT_ID:consumers}

jwt.secret=${JWT_SECRET:prismite-super-secret-key-prismite-super-secret-key}
